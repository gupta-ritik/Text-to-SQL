services:
  - type: web
    name: text-to-sql-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: text-to-sql-db
          property: connectionString
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LANGSMITH_TRACING
        value: "false"

databases:
  - name: text-to-sql-db
    databaseName: texttosql
    user: texttosql
    plan: free
