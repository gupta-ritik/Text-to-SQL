services:
  backend:
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    volumes:
      - ./database:/app/database
      - ./chroma:/app/chroma
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m app.database.seed &&
             python -m app.rag.ingest &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
